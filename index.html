@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#060B1B;--glow:radial-gradient(1000px 520px at 100% -12%,rgba(60,120,255,.22),transparent 62%),radial-gradient(760px 440px at -6% -4%,rgba(120,90,255,.16),transparent 60%);
  --surface:rgba(135,160,255,.065);--surface-line:rgba(150,175,255,.16);--raise:#101936;--ctl:rgba(140,165,255,.10);--field:rgba(3,7,20,.55);--top:rgba(6,11,27,.86);
  --paper:rgba(140,165,255,.09);--ink:#EDF1FF;--ink-2:#A8B2D0;--ink-3:#7783A6;--on-ink:#0A1024;--line:rgba(150,175,255,.14);--line-2:rgba(150,175,255,.28);
  --blue:#6FABFF;--blue-deep:#A5CAFF;--btn:#2F6FE0;--btn-hover:#4A86EC;--ice:rgba(111,171,255,.16);
  --good:#4FD6A4;--warn:#F0B95A;--bad:#FF7A86;--on-bad:#2A0509;--warn-bg:rgba(240,185,90,.15);--warn-line:rgba(240,185,90,.4);--ok-bg:rgba(79,214,164,.15);--done-bg:rgba(160,175,220,.16);
  --shadow:0 30px 80px rgba(0,0,0,.55);color-scheme:dark
}}
:root[data-theme="dark"]{
  --bg:#060B1B;--glow:radial-gradient(1000px 520px at 100% -12%,rgba(60,120,255,.22),transparent 62%),radial-gradient(760px 440px at -6% -4%,rgba(120,90,255,.16),transparent 60%);
  --surface:rgba(135,160,255,.065);--surface-line:rgba(150,175,255,.16);--raise:#101936;--ctl:rgba(140,165,255,.10);--field:rgba(3,7,20,.55);--top:rgba(6,11,27,.86);
  --paper:rgba(140,165,255,.09);--ink:#EDF1FF;--ink-2:#A8B2D0;--ink-3:#7783A6;--on-ink:#0A1024;--line:rgba(150,175,255,.14);--line-2:rgba(150,175,255,.28);
  --blue:#6FABFF;--blue-deep:#A5CAFF;--btn:#2F6FE0;--btn-hover:#4A86EC;--ice:rgba(111,171,255,.16);
  --good:#4FD6A4;--warn:#F0B95A;--bad:#FF7A86;--on-bad:#2A0509;--warn-bg:rgba(240,185,90,.15);--warn-line:rgba(240,185,90,.4);--ok-bg:rgba(79,214,164,.15);--done-bg:rgba(160,175,220,.16);
  --shadow:0 30px 80px rgba(0,0,0,.55);color-scheme:dark
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--glow),var(--bg);background-color:var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5;min-height:100%;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration-color:rgba(11,92,213,.35);text-underline-offset:3px}
a:hover{color:var(--blue-deep)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--display);font-weight:800;letter-spacing:0}
p{margin:0}
.lt{font-weight:300;color:var(--ink-3)}
.boot{padding:40px var(--gutter-r) 40px var(--gutter-l);color:var(--ink-3);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.num,.tabnum{font-variant-numeric:tabular-nums}
.dim{color:var(--ink-3)}
.muted{color:var(--ink-2)}

/* brand */
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{display:inline-block;flex:none;width:21px;height:27px;background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;color:var(--ink)}
.brand-name{font-family:var(--display);font-weight:800;font-size:27px;line-height:1;white-space:nowrap}
.tagline{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}

/* buttons, inputs */
.btn{
  font:500 13.5px/1 var(--body);color:var(--ink);background:var(--ctl);
  border:1px solid var(--line-2);border-radius:999px;padding:9px 16px;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;white-space:nowrap;text-decoration:none;
}
.btn:hover{border-color:var(--ink);color:var(--ink)}
.btn.primary{background:var(--btn);border-color:var(--btn);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--btn-hover);border-color:var(--btn-hover);color:#fff}
.btn.ghost{border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{border-color:var(--line-2)}
.btn.danger{color:var(--bad);border-color:rgba(207,54,69,.4)}
.btn.danger.armed{background:var(--bad);color:var(--on-bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.sm{padding:7px 12px;font-size:12.5px}
.icon-btn{
  width:28px;height:28px;border-radius:999px;border:1px solid var(--line-2);background:var(--ctl);color:var(--ink-2);
  cursor:pointer;font-size:16px;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex:none
}
.icon-btn:hover{color:var(--ink);border-color:var(--ink)}
.icon-btn.danger:hover{color:var(--bad);border-color:var(--bad)}
.icon-btn.armed{background:var(--bad);color:var(--on-bad);border-color:var(--bad);width:auto;padding:0 10px;font-size:12px;font-weight:600}
.linkish{background:none;border:0;padding:0;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-align:left}
.linkish:hover{color:var(--blue)}
.linkish.dim{color:var(--ink-3);font-weight:400}

label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
input,select,textarea{
  font:14px/1.4 var(--body);color:var(--ink);background:var(--field);
  border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;width:100%;
}
textarea{resize:vertical;min-height:84px}
input::placeholder,textarea::placeholder{color:var(--ink-3);opacity:.75}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,92,213,.14)}
.hint{font-size:12.5px;color:var(--ink-3);margin-top:6px}

/* pills */
.pill{
  display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--paper);color:var(--ink-2);white-space:nowrap
}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.live,.pill.planned{background:var(--ice);color:var(--blue)}
.pill.paused,.pill.warn,.pill.scheduled{background:var(--warn-bg);color:var(--warn)}
.pill.completed{background:var(--done-bg);color:var(--ink)}
.pill.ok{background:var(--ok-bg);color:var(--good)}
.plat{display:inline-block;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}

/* surfaces: sections sit on the page under a hairline, as in the deck */
.glass{background:var(--surface);border:1px solid var(--surface-line);border-radius:20px}
.panel{background:var(--surface);border:1px solid var(--surface-line);border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h,.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel-h{border-bottom:1px solid var(--line-2);padding-bottom:10px}
.sec-h{margin-bottom:14px}
.panel-h h2,.sec-h h2{font-size:34px;line-height:1}
.sec-h .s{font-size:12.5px;color:var(--ink-3)}
.count{font-family:var(--display);font-weight:300;color:var(--ink-3);margin-left:8px}
.section-label{font-family:var(--display);font-weight:800;font-size:26px;line-height:1}

/* figures */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:22px 28px;background:var(--surface);border:1px solid var(--surface-line);border-radius:20px;padding:22px}
.tile{background:none;border:0;border-radius:0;padding:0;display:flex;flex-direction:column;min-width:0}
.tile .v{font-family:var(--display);font-weight:800;font-size:60px;line-height:.95;color:var(--blue);font-variant-numeric:normal}
.tile .k{font-family:var(--display);font-weight:700;font-size:25px;line-height:1.1;margin-top:2px}
.tile .s{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.tile.internal .v{color:var(--ink-3)}

/* tables */
.wrap{overflow-x:auto;min-width:0}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:6px 12px 10px 0;white-space:nowrap}
.tbl td{padding:11px 12px 11px 0;border-top:1px solid var(--line);vertical-align:middle}
.tbl th:last-child,.tbl td:last-child{padding-right:0}
.tbl .r{text-align:right}
.tbl .who{display:flex;flex-direction:column;min-width:130px}
.tbl .who > :first-child{font-weight:600}
.tbl .who a{text-decoration:none;color:var(--ink)}
.tbl .who a:hover{color:var(--blue)}
.tbl .who .h{font-size:12.5px;color:var(--ink-3)}
.tbl tr.sched td{color:var(--ink-3)}
.clickrow{cursor:pointer}
.clickrow:hover td{background:var(--paper)}

/* progress */
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--blue)}
.bar.thin{height:4px}
.hit{font-weight:600}

/* ---------- sky band ---------- */
.hero{background:var(--hero);background-color:#2A66D8;color:#fff;border-radius:26px;padding:30px 30px 28px;display:flex;flex-direction:column;gap:16px;min-width:0}
.hero h1{font-size:clamp(50px,8.4vw,104px);line-height:.9;color:#fff;max-width:14ch}
.hero h1 b{font-weight:800}
.hero .lt{color:rgba(255,255,255,.72)}
.hero .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:rgba(255,255,255,.92)}
.hero .lede{font-size:17px;line-height:1.45;max-width:58ch;color:#fff}
.hero .pill{background:rgba(255,255,255,.2);color:#fff}
.hero .eyebrow{color:rgba(255,255,255,.82)}
.hero .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.55);color:#fff}
.hero .btn:hover{background:#fff;color:#0A3E9C;border-color:#fff}
.hero .btn.primary{background:#fff;border-color:#fff;color:#0A3E9C}
.note{border-left:2px solid rgba(255,255,255,.75);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:4px;max-width:66ch}
.note p{white-space:pre-line}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:8px}
.kpi{background:rgba(12,40,130,.26);border:1px solid rgba(255,255,255,.34);border-radius:20px;padding:16px 18px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.kpi-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.kpi .big{font-family:var(--display);font-weight:800;font-size:62px;line-height:.9;font-variant-numeric:normal}
.kpi .of{font-family:var(--display);font-weight:300;font-size:26px;color:rgba(255,255,255,.85);white-space:nowrap}
.kpi .bar{background:rgba(255,255,255,.26)}
.kpi .bar > i{background:#fff}
.kpi-foot{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:rgba(255,255,255,.9)}
.hero .tiles{margin-top:6px;background:none;border:0;padding:0;border-radius:0}
.hero .tile .v,.hero .tile .k{color:#fff}
.hero .tile .k{font-weight:300;color:rgba(255,255,255,.88)}
.hero.empty{align-items:flex-start}
.hero.empty h2{font-size:clamp(40px,6vw,64px);line-height:.95;color:#fff}
.hero.empty p{max-width:60ch}

/* ---------- HQ (admin) ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:12px var(--gutter-r) 12px var(--gutter-l);
  background:var(--top);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line-2)
}
.top .logo{color:var(--blue)}
.pub{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pub .when{font-size:12.5px;color:var(--ink-3)}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;padding:24px var(--gutter-r) 56px var(--gutter-l);max-width:1440px;margin:0 auto}
.side{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);align-self:start;max-height:calc(100vh - 104px);overflow:auto}
.nav{
  display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;
  background:transparent;border:0;border-radius:999px;padding:8px 14px;color:var(--ink-2);font:500 14px var(--body);cursor:pointer
}
.nav:hover{color:var(--ink);background:var(--paper)}
.nav.on{background:var(--ink);color:var(--on-ink)}
.nav .n{font-size:12px;opacity:.6}
.nav .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:18px 6px 8px 14px}
.side-empty{font-size:12.5px;color:var(--ink-3);padding:4px 14px}
main{display:flex;flex-direction:column;gap:30px;min-width:0}
.crumb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-3);margin-bottom:-14px}
.crumb button{background:none;border:0;padding:0;color:var(--ink-2);font:inherit;cursor:pointer}
.crumb button:hover{color:var(--blue)}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-h h1{font-size:clamp(46px,6vw,76px);line-height:.92}
.hero .page-h h1{max-width:none}
.page-h .meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px;color:var(--ink-2);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkbox{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.linkbox input{flex:1 1 320px;font-family:var(--mono);font-size:12.5px;min-width:0}
.code{font-family:var(--mono);font-size:12.5px;background:var(--paper);border:1px solid var(--line);padding:2px 8px;border-radius:6px;letter-spacing:.04em;white-space:nowrap}
.callout{border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.ccard{padding:18px 20px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;min-width:0}
.ccard:hover{border-color:var(--blue)}
.ccard h3{font-size:34px;line-height:.98}
.ccard .row{display:flex;gap:6px 14px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap;align-items:center}
.ccard.add{border-style:dashed;border-color:var(--line-2);align-items:center;justify-content:center;color:var(--ink-2);min-height:140px;font-weight:500}
.ccard.add:hover{color:var(--blue)}
.mini-kpi{display:flex;flex-direction:column;gap:5px}
.mini-kpi .t{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);gap:8px}
.cell{
  background:transparent;border:1px solid transparent;border-radius:8px;padding:5px 7px;color:var(--ink);
  font:13.5px var(--body);width:92px;text-align:right;font-variant-numeric:tabular-nums
}
.cell:hover{border-color:var(--line-2)}
.cell:focus{border-color:var(--blue);background:var(--field)}
.cell.date{width:138px;text-align:left}
.cell.txt{width:118px;text-align:left;font-family:var(--mono);font-size:12.5px}
.cell.wide{width:230px;text-align:left;font-family:var(--mono);font-size:12.5px}
select.cell{width:auto;text-align:left;padding-right:4px}
.reflink{display:flex;align-items:center;gap:6px;min-width:0}
.reflink a{font-family:var(--mono);font-size:12.5px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th-int{color:var(--warn)!important}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer;margin:0}
.toggle input{width:16px;height:16px;accent-color:var(--blue)}
.kpi-row-a{display:grid;grid-template-columns:minmax(120px,1.4fr) minmax(110px,1fr) minmax(0,2fr) 60px;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.kpi-row-a:last-child{border-bottom:0}
.kpi-row-a .lbl{font-family:var(--display);font-weight:700;font-size:25px;line-height:1.05}
.kpi-row-a .lbl small{display:block;font-family:var(--body);color:var(--ink-3);font-weight:400;font-size:12.5px;margin-top:2px}
.kpi-row-a .val{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12.5px}
.kpi-row-a .val > span:first-child{font-variant-numeric:normal;font-family:var(--display);font-weight:800;font-size:34px;line-height:1;color:var(--blue)}
.kpi-row-a .val .cell{width:120px;border-color:var(--line-2);text-align:left;font-weight:600}
.kpi-row-a .pct{text-align:right;font-family:var(--display);font-weight:700;font-size:25px;color:var(--ink-2)}
.notice{padding:18px 20px;color:var(--ink-2)}
.stale{font-size:12.5px;color:var(--warn)}

/* proposals */
.pill.st-sent{background:var(--ice);color:var(--blue)}
.pill.st-negotiating{background:var(--warn-bg);color:var(--warn)}
.pill.st-lost{color:var(--ink-3)}
select.cell.stage{border-color:var(--line-2);border-radius:999px;padding:5px 10px;font-weight:600;font-size:12.5px}
select.cell.st-sent{color:var(--blue)}
select.cell.st-negotiating{color:var(--warn)}
select.cell.st-lost{color:var(--ink-3)}
.tiles.flat{background:none;border:0;padding:4px 0 6px;border-radius:0}
.pkgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.pkg{padding:20px 22px;display:flex;flex-direction:column;gap:6px;min-width:0}
.panel .pkg{background:var(--paper);border-color:var(--line)}
.pk-n{font-family:var(--display);font-weight:700;font-size:27px;line-height:1}
.price{font-family:var(--display);font-weight:800;font-size:60px;line-height:.95;color:var(--blue)}
.pkg ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:0;color:var(--ink-2)}
.pkg li{padding:8px 0;border-top:1px solid var(--line)}
.terms{white-space:pre-line;max-width:76ch;color:var(--ink-2)}
.terms strong{color:var(--ink)}
.flabel{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.rows{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.rows:empty{margin:0}
.pkg-edit{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
.pkg-edit .ln{display:grid;grid-template-columns:minmax(0,1fr) 130px 28px;gap:8px;align-items:center}
.pkg-edit textarea{min-height:70px}
.ms-edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 28px;gap:8px;align-items:center}

/* progress history */
.growth{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.gcard{gap:10px}
.panel .gcard{background:var(--paper);border-color:var(--line)}
.g-top{display:flex;flex-direction:column;gap:2px}
.g-v{font-family:var(--display);font-weight:800;font-size:56px;line-height:.95;color:var(--blue)}
.g-d{font-size:13px;color:var(--ink-2);max-width:56ch}
.lc{color:var(--ink)}
.lc-grid{stroke:currentColor;stroke-opacity:.1}
.lc-grid.base{stroke-opacity:.3}
.lc-target{stroke:var(--ink-3);stroke-dasharray:4 4}
.lc-tl{fill:var(--ink-2)!important}
.lc-area{fill:var(--blue);fill-opacity:.12}
.lc-line{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.lc-dot{fill:var(--raise);stroke:var(--blue);stroke-width:2}
.lc-dot.end{fill:var(--blue)}
.deck-cta{flex-direction:row;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.deck-cta h2{font-size:34px;line-height:1;margin:2px 0 4px}
.dk-t{display:flex;flex-direction:column;min-width:0;flex:1 1 320px}

/* creator roster */
.tbl.roster td.txt{min-width:190px;max-width:320px;white-space:normal;line-height:1.4}
.tbl.roster td.txt strong{font-weight:600}
.tbl tfoot td{border-top:1px solid var(--line-2);font-weight:600;padding-top:12px}
.tbl.roster .who .h a{color:var(--blue);text-decoration:none}
.cell.mid{width:140px;text-align:left;font-size:12.5px}
.tbl.roster .cell.wide{width:196px;font-family:var(--body)}
.tbl.roster .cell:not(.wide):not(.mid){width:80px}
.tbl.roster th,.tbl.roster td{padding-right:8px}

.tbl.roster td.fol,.tbl.roster th.fol{padding-right:22px;border-right:1px solid var(--line)}
.tbl.roster td.fol{font-family:var(--display);font-weight:800;font-size:24px;line-height:1;color:var(--blue);white-space:nowrap}
.tbl.roster td.fol .cell{font-family:var(--display);font-weight:800;font-size:22px;color:var(--blue);width:96px}
.tbl.roster tfoot td.fol{font-size:26px}
.tbl.roster td.fol + td{padding-left:16px}
.tbl.roster th.fol + th{padding-left:16px}
.tbl.roster td.fee{background:var(--warn-bg)}
.tbl.roster th.fee{white-space:nowrap}

.tpl{background:var(--ice);border-radius:14px;padding:14px 16px}
.tpl select{flex:1 1 240px;min-width:0}
.tpl .hint{margin-bottom:0}
/* client logos */
.hero{position:relative}
.hero-logo{position:absolute;top:24px;right:24px;width:84px;height:84px;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center;padding:12px;box-shadow:0 10px 30px rgba(10,30,90,.22)}
.hero-logo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.hero .row{padding-right:100px}
.xmark{font-family:var(--display);font-weight:300;font-size:26px;color:var(--ink-3);line-height:1}
.clogo-sm{height:28px;width:auto;max-width:110px;object-fit:contain;border-radius:6px;background:#fff;padding:2px}
.logo-tile{width:64px;height:64px;border-radius:16px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:9px;flex:none;overflow:hidden}
.logo-tile img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.logo-tile.empty{border-style:dashed;border-color:var(--line-2);background:transparent;color:var(--ink-3);font:500 11.5px var(--body);cursor:pointer;text-align:center}
.logo-tile.empty:hover{color:var(--blue);border-color:var(--blue)}
.client-h{display:flex;align-items:center;gap:16px;min-width:0}
.logo-field{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo-btns{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.logo-btns input[type=file]{border:0;padding:0;background:none;font-size:13px}
.nav-logo{width:18px;height:18px;object-fit:contain;border-radius:5px;background:#fff;vertical-align:-4px;margin-right:8px}
@media (max-width:560px){.hero-logo{width:60px;height:60px;top:18px;right:18px;padding:8px;border-radius:14px}.hero .row{padding-right:70px}.hero h1{max-width:calc(100% - 64px)}.r-top .tagline{display:none}}
.hero-logo.full,.logo-tile.full{padding:0;background:transparent;border-color:transparent;overflow:hidden}
.hero-logo.full img,.logo-tile.full img{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover}
.hero-logo.full{box-shadow:0 10px 30px rgba(10,30,90,.28)}
.clogo-sm.full{padding:0;background:none;width:28px;object-fit:cover;border-radius:7px}
.nav-logo.full{background:none;object-fit:cover}
/* creator network */
.net-filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.net-filters input[type=search]{width:260px;flex:0 1 260px;min-width:0;border-radius:999px;padding:8px 14px}
.dialog .net-filters input[type=search]{flex:1 1 240px}
#net-table td.txt{min-width:130px}
#net-table td.txt.sm{min-width:90px}
#net-table th,#net-table td{padding-right:10px}
.net-filters select{width:auto;border-radius:999px;padding:8px 12px}
.tbl.roster td.txt.sm{min-width:120px;font-size:13px;color:var(--ink-2)}
.empty-net{padding:28px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty-net h2{font-size:40px;line-height:.98;max-width:22ch}
.empty-net p{max-width:68ch}
.pick-list{display:flex;flex-direction:column;max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:14px}
.pick-row{display:flex;align-items:center;gap:12px;padding:10px 14px;margin:0;border-top:1px solid var(--line);cursor:pointer;color:var(--ink)}
.pick-row:first-child{border-top:0}
.pick-row:hover{background:var(--paper)}
.pick-row.has{opacity:.55;cursor:default}
.pick-row input{width:16px;height:16px;flex:none;accent-color:var(--blue)}
.pk-main{flex:1;min-width:0;font-size:14px}
.pk-sub{display:block;font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-fol{font-family:var(--display);font-weight:800;font-size:22px;color:var(--blue);flex:none}
/* track record, attention */
.tracked{display:block;font-size:12px;color:var(--good);font-weight:600;margin-top:3px}
.trk{color:var(--good)}
.att{display:flex;flex-direction:column}
.att-row{display:grid;grid-template-columns:180px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 4px;font:inherit;color:var(--ink);cursor:pointer}
.att-row:first-child{border-top:0}
.att-row:hover{background:var(--paper)}
.att-t{font-weight:600;display:flex;align-items:center;gap:8px}
.att-t::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none}
.att-row.warn .att-t::before{background:var(--warn)}
.att-d{color:var(--ink-2);min-width:0}
.att-go{color:var(--blue);font-size:12.5px;white-space:nowrap}
button.pill{border:0;cursor:pointer;font-family:var(--body)}
#wk-text{font-family:var(--body);font-size:13.5px;line-height:1.5;min-height:260px}
@media (max-width:560px){.att-row{grid-template-columns:1fr;gap:2px}.att-go{display:none}}
/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(18,32,74,.42);display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding:max(24px,env(safe-area-inset-top,0px)) var(--gutter-r) max(24px,env(safe-area-inset-bottom,0px)) var(--gutter-l)}
.dialog{background:var(--raise);border:1px solid var(--line);border-radius:24px;width:100%;max-width:640px;padding:26px;display:flex;flex-direction:column;gap:16px;margin-top:4vh;box-shadow:var(--shadow)}
.dialog h2{font-size:44px;line-height:.95}
.dialog .lead{color:var(--ink-2);font-size:13.5px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}
.dialog .foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding-top:4px}
.sep{border:0;border-top:1px solid var(--line-2);margin:4px 0}
.kpi-edit,.kpi-head{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 92px minmax(0,1.4fr) 28px;gap:8px;align-items:center}
.kpi-edit input,.kpi-edit select{padding:7px 9px;font-size:13px}
.kpi-head{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.12em;font-weight:500}
#kpi-rows{display:flex;flex-direction:column;gap:8px}
.presets{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dialog .panel-h{border-bottom:0;padding-bottom:0;align-items:center}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:12px;color:var(--ink-2);font-size:13.5px}
.steps strong{color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;
  background:var(--ink);color:var(--on-ink);padding:11px 18px;border-radius:999px;font-size:13.5px;max-width:min(92vw,560px);box-shadow:0 12px 40px rgba(14,30,80,.25)}

/* preview overlay */
.preview{position:fixed;inset:0;z-index:40;overflow:auto;background:var(--glow),var(--bg);background-color:var(--bg)}
.prev-bar{
  position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding:calc(10px + env(safe-area-inset-top,0px)) var(--gutter-r) 10px var(--gutter-l);background:#131A30;color:#fff;font-size:13px
}
.prev-bar .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.prev-bar .btn:hover{background:#fff;color:#131A30}

/* ---------- Client report ---------- */
.report{max-width:1120px;margin:0 auto;padding:22px var(--gutter-r) 40px var(--gutter-l);display:flex;flex-direction:column;gap:38px}
.r-top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:-18px}
.r-top .logo{color:var(--blue);width:24px;height:31px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:-20px}
.tab{background:var(--ctl);border:1px solid var(--line-2);color:var(--ink-2);border-radius:999px;padding:8px 16px;font:500 13px var(--body);cursor:pointer}
.tab:hover{color:var(--ink);border-color:var(--ink)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:36px}
.chart{width:100%;height:auto;display:block;color:var(--ink)}
.r-top .actions,.top .brand .icon-btn{margin-left:4px}
.theme-btn::before{content:"";width:13px;height:13px;border-radius:50%;border:1.5px solid currentColor;background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.chart text{fill:var(--ink-3);font:11px var(--body)}
.plats{display:flex;flex-direction:column;gap:16px;padding-top:4px}
.plats .pr{display:flex;flex-direction:column;gap:7px}
.plats .pt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.plats .pt span:first-child{font-family:var(--display);font-weight:700;font-size:25px;line-height:1}
.plats .pt span:last-child{color:var(--ink-2);font-size:12.5px;font-variant-numeric:tabular-nums}
.r-note{font-size:12.5px;color:var(--ink-3);max-width:70ch;margin-bottom:-22px}
.r-foot{display:flex;justify-content:space-between;gap:8px 24px;flex-wrap:wrap;border-top:1px solid var(--line-2);padding-top:12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.openlink{white-space:nowrap}

/* gate */
.gate{min-height:100vh;min-height:100dvh;background:var(--hero);background-color:#2A66D8;display:flex;align-items:flex-start;justify-content:center;padding:14vh var(--gutter-r) 40px var(--gutter-l);margin-block:calc(-1 * env(safe-area-inset-top,0px)) calc(-1 * env(safe-area-inset-bottom,0px))}
.gate-card{background:var(--raise);border-radius:26px;width:100%;max-width:460px;padding:30px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px rgba(10,30,90,.3)}
.gate-card .logo{color:var(--blue)}
.gate-card h1{font-size:68px;line-height:.9}
.gate-card p{color:var(--ink-2)}
.gate-card form{display:flex;flex-direction:column;gap:10px}
.gate-card input{font-family:var(--mono)}
.gate-card .btn{justify-content:center;padding:12px 16px}
.err{color:var(--bad);font-size:13px}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:18px}
  .side{position:static;flex-direction:row;overflow-x:auto;max-height:none;gap:6px;padding-bottom:4px}
  .side .nav{width:auto;flex:none;border:1px solid var(--line-2)}
  .side .nav.on{border-color:var(--ink)}
  .side-h{padding:0 2px;flex:none}
  .side-h .eyebrow{display:none}
  .side-empty{display:none}
  .two{grid-template-columns:minmax(0,1fr)}
  .kpi-row-a{grid-template-columns:1fr 1fr;row-gap:8px}
  .kpi-row-a .barcell{grid-column:1/-1;order:3}
  .kpi-row-a .pct{order:2}
}
@media (max-width:560px){
  .panel{padding:16px}
  .tiles{padding:18px 16px}
  .fgrid{grid-template-columns:1fr}
  .kpi-edit,.kpi-head{grid-template-columns:1fr 1fr}
  .kpi-head{display:none}
  .kpi-edit{padding-bottom:10px;border-bottom:1px solid var(--line)}
  .top .tagline{display:none}
  .hero{padding:22px 20px;border-radius:22px}
  .tile .v{font-size:50px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .big{font-size:54px}
  .dialog{padding:20px}
}
@media (prefers-reduced-motion:no-preference){
  .bar > i{transition:width .6s cubic-bezier(.2,.7,.2,1)}
}

function viewsChart(live) {
  const m = new Map();
  for (const p of live) if (p.date) m.set(p.date, (m.get(p.date) || 0) + (+p.views || 0));
  let days = [...m.keys()].sort();
  if (days.length < 2) return "";
  const first = pd(days[0]), last = pd(days[days.length - 1]);
  const span = Math.round((last - first) / 864e5) + 1;
  if (span <= 120) {
    days = [];
    for (let i = 0; i < span; i++) { const d = new Date(first); d.setDate(d.getDate() + i); days.push(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0")); }
  }
  const vals = days.map(d => m.get(d) || 0);
  const max = Math.max(...vals) || 1;
  const step = Math.pow(10, Math.floor(Math.log10(max)));
  const nice = [1, 2, 2.5, 5, 10].map(x => x * step).find(x => x >= max) || max;
  const W = 640, H = 230, L = 50, R = 10, T = 14, B = 30;
  const iw = W - L - R, ih = H - T - B, n = vals.length, slot = iw / n, bw = Math.max(2, Math.min(28, slot * 0.68));
  let g = "";
  for (const f of [0, 0.5, 1]) {
    const y = T + ih - ih * f;
    g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke="currentColor" stroke-opacity="' + (f ? 0.12 : 0.36) + '" stroke-width="1"/>' +
      '<text x="' + (L - 8) + '" y="' + (y + 4) + '" text-anchor="end">' + compact(nice * f) + "</text>";
  }
  let bars = "";
  vals.forEach((v, i) => {
    const hgt = (v / nice) * ih, x = L + slot * i + (slot - bw) / 2;
    if (v > 0) bars += '<rect x="' + x.toFixed(1) + '" y="' + (T + ih - hgt).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(1, hgt).toFixed(1) + '" rx="2" fill="url(#pdg)"><title>' + esc(fmtDate(days[i])) + ": " + compact(v) + " views</title></rect>";
  });
  const lab = [0, Math.floor((n - 1) / 2), n - 1].filter((v, i, a) => a.indexOf(v) === i);
  let xl = "";
  lab.forEach(i => {
    const x = L + slot * i + slot / 2;
    xl += '<text x="' + x.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + (i === 0 ? "start" : i === n - 1 ? "end" : "middle") + '">' + esc(fmtDate(days[i])) + "</text>";
  });
  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Views per day of posting"><defs><linearGradient id="pdg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#0B5CD5"/><stop offset="1" stop-color="#4A93E8"/></linearGradient></defs>' + g + bars + xl + "</svg>";
}

function platformRows(live, totalViews) {
  const m = {};
  for (const p of live) { const k = p.platform || "other"; m[k] = m[k] || { n: 0, v: 0 }; m[k].n++; m[k].v += +p.views || 0; }
  const rows = Object.entries(m).sort((a, b) => b[1].v - a[1].v);
  return '<div class="plats">' + rows.map(([k, o]) => {
    const share = totalViews ? (o.v / totalViews) * 100 : 0;
    return '<div class="pr"><div class="pt"><span>' + esc(PLAT[k] || "Other") + "</span><span>" + o.n + " post" + (o.n === 1 ? "" : "s") + " · " + compact(o.v) + " views</span></div>" +
      '<div class="bar thin"><i style="width:' + share.toFixed(1) + '%"></i></div></div>';
  }).join("") + "</div>";
}

function creatorTable(c, live) {

    rows.map(o => {

      return '<tr><td><div class="who">' + (prof ? '<a href="' + esc(prof) + '" target="_blank" rel="noopener noreferrer">' + esc(o.name) + "</a>" : "<span>" + esc(o.name) + "</span>") + (o.handle ? '<span class="h">' + esc(o.handle) + "</span>" : "") + "</div></td>" +

          "<td>" + (link ? '<div class="reflink"><a href="' + esc(link) + '" target="_blank" rel="noopener noreferrer" title="' + esc(link) + '">' + esc(shortLink(link)) + '</a><button class="btn sm" data-ract="copy" data-v="' + esc(link) + '">Copy</button></div>' : '<span class="dim">–</span>') + "</td>" : "") +
        '<td class="r">' + o.posts + '</td><td class="r">' + compact(o.views) + '</td><td class="r">' + (o.views ? r1((o.eng / o.views) * 100) + "%" : "–") + "</td>" +

    }).join("") + "</tbody></table>";
}

async function adminMode(hasHash) {

function allReady() { return S.ready.clients && S.ready.campaigns && S.ready.posts && S.ready.creators && S.ready.history && S.ready.network && S.ready.templates; }

/* ---------- writes ---------- */
function errText(e) {
  const c = e && e.code;
  if (c === "quota_exceeded") return "Storage is full. Delete old campaigns or posts, then try again.";
  if (c === "invalid_argument") return "That change couldn't be saved. Your account may only have view access to this page.";
  if (c === "resource_exhausted") return "Too many changes at once. Wait a moment and try again.";
  return "That change didn't save. Check your connection and try again.";
}
function chain(path, fn) {
  Q[path] = (Q[path] || Promise.resolve()).then(fn).catch(e => toast(errText(e)));
  return Q[path];
}
function touch() {
  clearTimeout(touchTimer);
  touchTimer = setTimeout(() => chain("meta/state", () => S.db.doc("meta/state").set({ editedAt: Date.now() })), 500);
}
function upd(coll, id, patch) { touch(); return chain(coll + "/" + id, () => S.db.doc(coll + "/" + id).update(Object.assign({}, patch, { updatedAt: Date.now() }))); }
async function add(coll, data) { touch(); const now = Date.now(); return S.db.collection(coll).add(Object.assign({ createdAt: now, updatedAt: now }, data)); }
function del(coll, id) { touch(); return chain(coll + "/" + id, () => S.db.doc(coll + "/" + id).delete()); }

  if (MODE !== "admin") return;

      (S.settings.siteAt ? '<span class="when">Site file ' + esc(ago(S.settings.siteAt)) + "</span>" : "") +

    (siteBase() && (S.settings.siteAt || 0) < (S.meta.editedAt || 0) ? '<button class="pill warn" data-act="hosting">Hosted site out of date</button>' : "") +
    '<button class="btn" data-act="backup">Backup</button>' +

}
function campsOf(cid) { return S.campaigns.filter(c => c.clientId === cid).sort((a, b) => (b.start || "").localeCompare(a.start || "")); }
function postsOf(cpid) { return S.posts.filter(p => p.campaignId === cpid); }
function creatorsOf(cpid) { return S.creators.filter(r => r.campaignId === cpid).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)); }
function historyOf(cpid) { return S.history.filter(h => h.campaignId === cpid).sort((a, b) => (a.date || "").localeCompare(b.date || "")); }
const histTimers = {};
function recordHistory(cpid) {
  clearTimeout(histTimers[cpid]);
  histTimers[cpid] = setTimeout(() => {
    const cp = S.campaigns.find(x => x.id === cpid); if (!cp || isProp(cp)) return;
    const t = campTotals(cpid), k = {};
    for (const x of cp.kpis || []) { if (!HIST_SRC.includes(x.source || "manual")) continue; const a = kpiActual(x, t); if (a != null) k[x.id] = a; }
    const d = today(), path = "history/" + cpid + "_" + d;
    touch();
    chain(path, () => S.db.doc(path).set({ campaignId: cpid, date: d, signups: t.signups, volume: t.volume, kpis: k, at: Date.now() }));
  }, 900);
}
function campTotals(cpid) { return totals(postsOf(cpid), creatorsOf(cpid)); }

function renderSide() {
  const el = document.getElementById("side"); if (!el) return;

          : "<span>" + esc(fmtRange(cp.start, cp.end) || "No dates") + "</span><span>" + tt.posts + " posts</span><span>" + compact(tt.views) + " views</span>") + "</div>" +
        (ap == null || isProp(cp) ? "" : '<div class="mini-kpi"><div class="t"><span>Targets</span><span>' + Math.round(ap) + '%</span></div><div class="bar thin"><i style="width:' + ap + '%"></i></div></div>') + "</button>";

  return h;
}

function viewCampaign(id) {

    (!prop ? '<button class="btn primary" data-act="weekly" data-id="' + esc(id) + '">Copy weekly update</button>' : "") +
    '<button class="btn" data-act="preview" data-id="' + esc(cl.id) + '">Preview as client</button><button class="btn" data-act="edit-campaign" data-id="' + esc(id) + '">' + (prop ? "Edit proposal" : "Edit campaign") + "</button>" +

  // targets
  h += '<section class="glass panel"><div class="panel-h"><h2>' + (prop ? "Expected results" : "Targets") + '</h2><button class="btn sm" data-act="edit-campaign" data-id="' + esc(id) + '" data-focus="kpis">' + (prop ? "Edit" : "Edit targets") + "</button></div>";
  if (!(cp.kpis || []).length) h += '<p class="muted">' + (prop ? "Add the results you expect, such as new users or trading volume. They become the campaign targets when the deal is won." : "No targets yet. Add targets such as new users or trading volume so the client can track progress.") + "</p>";
  else if (prop) h += cp.kpis.map(k => '<div class="kpi-row-a"><div class="lbl">' + esc(k.label) + '</div><div class="val"><span>' + esc(fmtVal(+k.target, k.unit)) + '</span><span class="dim">expected</span></div><div></div><div></div></div>').join("");

    '<button class="btn sm" data-act="bulk-creators" data-id="' + esc(id) + '">Paste creator list</button><button class="btn sm" data-act="new-creator" data-id="' + esc(id) + '">Add creator</button></div></div>';
  if (prop) {
    if (!roster.length) h += '<p class="muted">List the creators you are proposing, with followers, past results, deliverables and deal. Paste rows straight from your creator sheet. They carry over to the campaign when the deal is won.</p>';
    else {
      const reach = roster.reduce((a, r) => a + (+r.followers || 0), 0), fees = roster.reduce((a, r) => a + (+r.fee || 0), 0);
      const tc = (r, f, ph, cls) => '<td><input class="cell ' + cls + '" id="cr-' + esc(r.id) + "-" + f + '" data-creator="' + esc(r.id) + '" data-f="' + f + '" value="' + esc(r[f] || "") + '" placeholder="' + ph + '" aria-label="' + ph + '"></td>';

      roster.map(r => {

          ["signups", "volume"].map(f => '<td class="r"><input class="cell" id="cr-' + rid + "-" + f + '" data-creator="' + rid + '" data-f="' + f + '" value="' + (r[f] == null ? "" : esc(r[f])) + '" inputmode="decimal" aria-label="' + (f === "signups" ? "Sign-ups" : "Volume") + '"></td>').join("") +

  h += "</section>";

  if (prop) return h;
  // posts
  h += '<section class="glass panel"><div class="panel-h"><h2>Posts<span class="count">' + posts.length + '</span></h2><div class="actions"><button class="btn sm" data-act="bulk-posts" data-id="' + esc(id) + '">Paste post links</button><button class="btn sm" data-act="new-post" data-id="' + esc(id) + '">Add post</button></div></div>';

          "<td>" + (safeUrl(p.url) ? '<a class="openlink" href="' + esc(safeUrl(p.url)) + '" target="_blank" rel="noopener noreferrer">Open ↗</a>' : '<button class="linkish dim" data-act="edit-post" data-id="' + pid + '">Add link</button>') + "</td>" +
          '<td><input type="date" class="cell date" id="p-' + pid + '-date" data-post="' + pid + '" data-f="date" value="' + esc(p.date || "") + '" aria-label="Post date"></td>' +
          '<td><select class="cell" id="p-' + pid + '-status" data-post="' + pid + '" data-f="status" aria-label="Status"><option value="live"' + (p.status !== "scheduled" ? " selected" : "") + '>Live</option><option value="scheduled"' + (p.status === "scheduled" ? " selected" : "") + ">Scheduled</option></select></td>" +

  h += "</section>";

async function saveFile(filename, html, done) {
  const dl = await window.claude.use("downloads");
  if (!dl) { toast("Downloads aren't available in this view. Open the page from your claude.ai account."); return; }
  try { await dl.save({ filename, data: html }); toast(done); return true; }
  catch (e) {
    const c = e && e.code;
    if (c === "declined") return;
    if (c === "rate_limited") toast("A download is already waiting for your confirmation.");
    else toast("The download didn't start. Try again in a moment.");
  }
}
async function downloadSite(btn) {
  if (btn) btn.disabled = true;
  try {
    const at = Date.now();
    const html = buildHtml({ v: 1, publishedAt: at, entries: await buildEntries(S.clients, at) }, "Pandora Campaign Report");
    const okSaved = await saveFile("index.html", html, "Site file ready. Upload it to your site to update every client's report.");
    if (okSaved) chain("meta/settings", () => S.db.doc("meta/settings").set(Object.assign({}, S.settings, { siteAt: at })));
  } finally { if (btn) btn.disabled = false; }
}
async function downloadClient(id, btn) {
  const c = S.clients.find(x => x.id === id); if (!c || !c.code) return;
  if (btn) btn.disabled = true;
  try {
    const at = Date.now();
    const html = buildHtml({ v: 1, publishedAt: at, entries: await buildEntries([c], at), autoCode: c.code }, (c.name || "Client") + " Campaign Report");
    await saveFile(slug(c.name) + "-campaign-report.html", html, "Report file ready for " + c.name + ".");
  } finally { if (btn) btn.disabled = false; }
}
async function publish() {
  if (S.publishing) return;
  const art = await window.claude.use("artifact");
  if (!art) { toast("Publishing isn't available in this view. Open the page from your claude.ai account."); return; }
  S.publishing = true; renderTop();
  try {
    const at = Date.now();
    await art.publish(buildHtml({ v: 1, publishedAt: at, entries: await buildEntries(S.clients, at) }));
    toast("Published. Clients now see the latest numbers.");
  } catch (e) {
    const c = e && e.code;
    if (c === "conflict") toast("The page was updated somewhere else. It's reloading now; publish again once it opens.");
    else if (c === "not_writer" || c === "not_granted" || c === "consent_required" || c === "capability_disabled") toast("This view can't publish. Open the page from your claude.ai account.");
    else if (c === "too_large") toast("The reports are too large to publish. Remove old posts or campaigns and try again.");
    else if (c === "rate_limited") toast("Publishing too often. Wait a minute, then try again.");
    else toast("Publishing failed. Try again in a moment.");
  }
  S.publishing = false; renderTop();
}

/* ---------- events ---------- */
let toastT = null;
function toast(msg) {
  const t = document.getElementById("toast"); if (!t) return;
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 4200);
}
let armT = null;
function arm(key) { S.armed = key; clearTimeout(armT); armT = setTimeout(() => { S.armed = null; render(); }, 4000); render(); }

async function copyText(text, inputId) {
  try { await navigator.clipboard.writeText(text); toast("Link copied."); }
  catch (e) { const i = document.getElementById(inputId); if (i) { i.focus(); i.select(); } toast("Press Ctrl+C or Cmd+C to copy the selected link."); }
}

const BK_COLLS = ["clients", "campaigns", "posts", "creators", "history", "network", "templates"];
async function downloadBackup(btn) {
  if (btn) btn.disabled = true;
  try {
    const data = { kind: "pandora-hq-backup", v: 1, at: Date.now(), collections: {}, meta: { state: S.meta || {}, settings: S.settings || {} } };
    for (const k of BK_COLLS) data.collections[k] = S[k].map(r => Object.assign({}, r));
    await saveFile("pandora-hq-backup-" + today() + ".json", JSON.stringify(data), "Backup downloaded. Keep it somewhere safe: it includes fees and wallets.");
  } finally { if (btn) btn.disabled = false; }
}
async function importBackup(btn) {
  const data = S.bkData; if (!data) return;
  if (!btn.classList.contains("armed")) { btn.classList.add("danger", "armed"); btn.textContent = "Confirm import"; return; }
  btn.disabled = true;
  let done = 0, failed = 0; const total = BK_COLLS.reduce((a, k) => a + ((data.collections || {})[k] || []).length, 0);
  for (const k of BK_COLLS) for (const r of (data.collections || {})[k] || []) {
    if (!r || !r.id || /[\/]/.test(r.id)) { failed++; continue; }
    const o = Object.assign({}, r); delete o.id;
    try { await S.db.doc(k + "/" + r.id).set(o); done++; } catch (e) { failed++; }
    if (done % 25 === 0) btn.textContent = "Importing " + done + " of " + total + "…";
  }
  const st = (data.meta || {}).settings || {};
  if (st.siteUrl && !S.settings.siteUrl) await chain("meta/settings", () => S.db.doc("meta/settings").set(Object.assign({}, S.settings, { siteUrl: st.siteUrl })));
  touch(); S.bkData = null; closeModal();
  toast("Imported " + done + " records" + (failed ? ", " + failed + " couldn't be saved" : "") + ".");
}
function deleteClientCascade(id) {
  for (const cp of campsOf(id)) { for (const p of postsOf(cp.id)) del("posts", p.id); for (const r of creatorsOf(cp.id)) del("creators", r.id); for (const x of historyOf(cp.id)) del("history", x.id); del("campaigns", cp.id); }
  del("clients", id);
}
function setStage(id, v) {
  const cp = S.campaigns.find(x => x.id === id); if (!cp || stageOf(cp) === v) return;
  const patch = { stage: v };
  if ((v === "sent" || v === "negotiating") && !cp.sentAt) patch.sentAt = today();
  if (v === "won") { patch.status = "live"; patch.wonFrom = stageOf(cp); if (!cp.start) { patch.start = today(); patch.autoStart = true; } }
  upd("campaigns", id, patch);
  toast(v === "won" ? "Won. It is now a live campaign: add referral links and posts as they go out." : v === "sent" ? "Marked as sent. Publish to show it on the client link." : "Stage set to " + STAGE[v] + ".");
}
function revertToProposal(id) {
  const cp = S.campaigns.find(x => x.id === id); if (!cp) return;
  const back = cp.wonFrom && cp.wonFrom !== "won" ? cp.wonFrom : "negotiating";
  const patch = { stage: back, status: "planned", wonFrom: "" };
  if (cp.autoStart) { patch.start = ""; patch.autoStart = false; }
  upd("campaigns", id, patch);
  toast("Moved back to proposal (" + STAGE[back] + "). Posts, creators and history are kept. Publish to show the proposal on the client link again.");
}
function wireAdmin() {
  app.addEventListener("click", async e => {
    const el = e.target.closest("[data-act]"); if (!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    if (act === "backdrop") { if (e.target === el) closeModal(); return; }
    if (el.tagName === "TR" && e.target.closest("button,a,input,select")) return;
    switch (act) {
      case "go-home": S.view = { t: "home" }; render(); window.scrollTo(0, 0); break;
      case "go-network": if (S.modal) closeModal(); S.view = { t: "network" }; render(); window.scrollTo(0, 0); break;
      case "new-net": openModal("net"); break;
      case "edit-net": openModal("net", id); break;
      case "bulk-net": openModal("bulk-net"); break;
      case "pick-network": openModal("pick", id); break;
      case "del-net":
        if (S.armed === "net:" + id) { S.armed = null; del("network", id); } else arm("net:" + id);
        break;
      case "save-to-net": {
        const miss = creatorsOf(id).filter(r => !inNetwork(r)), seen = new Set();
        el.disabled = true;
        try {
          let n = 0;
          for (const r of miss) {
            if (!nkey(r) || seen.has(nkey(r))) continue; seen.add(nkey(r));
            const o = { niche: "", region: "", contact: "", wallet: "", notes: "" };
            for (const f of NET_FIELDS) o[f] = r[f] == null ? (f === "followers" || f === "fee" ? null : "") : r[f];
            const ref = await add("network", o); upd("creators", r.id, { networkId: ref.id }); n++;
          }
          toast("Saved " + n + " creator" + (n === 1 ? "" : "s") + " to your network.");
        } catch (err) { toast(errText(err)); el.disabled = false; }
        break;
      }
      case "go-client": S.view = { t: "client", id }; render(); window.scrollTo(0, 0); break;
      case "go-campaign": S.view = { t: "campaign", id }; render(); window.scrollTo(0, 0); break;
      case "new-client": openModal("client"); break;
      case "edit-client": openModal("client", id); break;
      case "new-campaign": S.newStage = "won"; openModal("campaign", null, id); break;
      case "new-proposal": S.newStage = "draft"; openModal("campaign", null, id); break;
      case "add-pkg": document.getElementById("pkg-rows").insertAdjacentHTML("beforeend", pkgRow()); document.querySelector("#pkg-rows .pkg-edit:last-child .pk-name").focus(); break;
      case "add-ms": document.getElementById("ms-rows").insertAdjacentHTML("beforeend", msRow()); document.querySelector("#ms-rows .ms-edit:last-child .ms-at").focus(); break;
      case "rm-row": el.closest("[data-row]").remove(); break;
      case "rm-logo": { S.logoDraft = ""; const pv = document.getElementById("c-logo-prev"); if (pv) pv.innerHTML = '<span class="dim">None</span>'; const fi = document.getElementById("c-logo"); if (fi) fi.value = ""; break; }
      case "dup": openModal("dup", id); break;
      case "backup": openModal("backup"); break;
      case "dl-backup": downloadBackup(el); break;
      case "import-backup": importBackup(el); break;
      case "sign-out": if (window.__PD_SIGNOUT) window.__PD_SIGNOUT(); break;
      case "tpl-save": openModal("tpl-save", id); break;
      case "weekly": openModal("weekly", id); break;
      case "copy-weekly": {
        const ta = document.getElementById("wk-text");
        try { await navigator.clipboard.writeText(ta.value); toast("Copied. Paste it into Telegram."); }
        catch (err) { ta.focus(); ta.select(); toast("Press Ctrl+C or Cmd+C to copy the selected text."); }
        break;
      }
      case "del-tpl": {
        const key = val("cp-tpl"); if (!key.startsWith("c:")) break;
        if (el.classList.contains("armed")) { del("templates", key.slice(2)); toast("Template deleted."); closeModal(); }
        else { el.classList.add("danger", "armed"); el.textContent = "Confirm delete"; }
        break;
      }
      case "rm-sample":
        if (S.armed === "sample") { S.armed = null; deleteClientCascade("example-client"); S.view = { t: "home" }; render(); toast("Sample data removed."); }
        else arm("sample");
        break;
      case "apply-tpl": {
        const n = applyTemplate(val("cp-tpl"), document.getElementById("mform"));
        toast(n ? (S.tplCreators && S.tplCreators.length ? "Template filled in. Its " + S.tplCreators.length + " creators are added when you save." : "Template filled in. Review the numbers, then save.") : "Nothing to fill: those fields already have content.");
        break;
      }
      case "mark-won": openModal("won", id); break;
      case "revert-prop":
        if (S.armed === "revert:" + id) { S.armed = null; revertToProposal(id); } else arm("revert:" + id);
        break;
      case "edit-campaign": openModal("campaign", id, el.dataset.focus); break;
      case "bulk-posts": openModal("bulk", id); break;
      case "new-post": openModal("post"); S.modal.camp = id; break;
      case "new-creator": openModal("creator"); S.modal.camp = id; break;
      case "edit-creator": openModal("creator", id); break;
      case "bulk-creators": openModal("bulk-creators", id); break;
      case "import-creators": {
        const miss = missingFromPosts(creatorsOf(id), postsOf(id));
        el.disabled = true;
        try {
          for (const m of miss) await add("creators", { campaignId: id, name: m.name, handle: m.handle, platform: m.platform, profileUrl: "", refCode: "", refLink: "", notes: "", signups: null, volume: null });
          toast("Added " + miss.length + " creator" + (miss.length === 1 ? "" : "s") + " from posts. Fill in their ref codes and links.");
        } catch (err) { toast(errText(err)); el.disabled = false; }
        break;
      }
      case "copy-creators": {
        const lines = creatorsOf(id).map(r => [r.name || r.handle, r.name ? r.handle : "", r.refCode, safeUrl(r.refLink)].filter(Boolean).join(" | "));
        try { await navigator.clipboard.writeText(lines.join("\n")); toast("Copied " + lines.length + " creators with their ref codes and links."); }
        catch (err) { toast("Copying isn't available here. Open the client preview and select the table instead."); }
        break;
      }
      case "copy-ref":
        try { await navigator.clipboard.writeText(el.dataset.v); toast("Referral link copied."); } catch (err) { toast("Copying isn't available here. Select the link and copy it."); }
        break;
      case "del-creator":
        if (S.armed === "creator:" + id) {
          S.armed = null; const r = S.creators.find(x => x.id === id); del("creators", id);
          if (r && (+r.signups || +r.volume)) { S.creators = S.creators.filter(x => x.id !== id); recordHistory(r.campaignId); }
        } else arm("creator:" + id);
        break;
      case "del-hist":
        if (S.armed === "hist:" + id) { S.armed = null; del("history", id); } else arm("hist:" + id);
        break;
      case "edit-post": openModal("post", id); break;
      case "close": closeModal(); break;
      case "add-kpi": document.getElementById("kpi-rows").insertAdjacentHTML("beforeend", kpiRow({})); document.querySelector("#kpi-rows .kpi-edit:last-child .k-label").focus(); break;
      case "preset": document.getElementById("kpi-rows").insertAdjacentHTML("beforeend", kpiRow({ label: el.dataset.l, unit: el.dataset.u, source: el.dataset.s })); document.querySelector("#kpi-rows .kpi-edit:last-child .k-target").focus(); break;
      case "rm-kpi": el.closest(".kpi-edit").remove(); break;
      case "preview": openPreview(id); break;
      case "close-preview": { const pv = document.getElementById("preview"); pv.hidden = true; pv.innerHTML = ""; break; }
      case "publish": publish(); break;
      case "hosting": openModal("hosting"); break;
      case "dl-site": downloadSite(el); break;
      case "dl-client": downloadClient(id, el); break;
      case "copy-link": { const c = S.clients.find(x => x.id === id); if (c) copyText(linkFor(c), "link-" + id); break; }
      case "reset-link":
        if (S.armed === "reset:" + id) { S.armed = null; upd("clients", id, { code: genCode() }); toast("New link created. Publish to clients to switch it on; the old link stops working then."); }
        else arm("reset:" + id);
        break;
      case "del-post":
        if (S.armed === "post:" + id) { S.armed = null; del("posts", id); } else arm("post:" + id);
        break;
      case "del-campaign":
        if (S.armed === "camp:" + id) {
          S.armed = null; const cp = S.campaigns.find(x => x.id === id);
          for (const p of postsOf(id)) del("posts", p.id);
          for (const r of creatorsOf(id)) del("creators", r.id);
          for (const x of historyOf(id)) del("history", x.id);
          del("campaigns", id); S.view = cp ? { t: "client", id: cp.clientId } : { t: "home" }; render(); toast("Campaign deleted.");
        } else arm("camp:" + id);
        break;
      case "del-client":
        if (S.armed === "client:" + id) {
          S.armed = null;
          deleteClientCascade(id); S.view = { t: "home" }; render(); toast("Client deleted.");
        } else arm("client:" + id);
        break;
    }
  });
  app.addEventListener("change", async e => {
    const el = e.target;
    if (el.dataset.stage) {
      const cp = S.campaigns.find(x => x.id === el.dataset.stage);
      if (el.value === "won" && cp && isProp(cp)) { el.value = stageOf(cp); openModal("won", cp.id); return; }
      setStage(el.dataset.stage, el.value); return;
    }
    if (el.id === "net-plat") { S.netPlat = el.value; filterRows("#net-table", S.netQ.toLowerCase(), S.netPlat); return; }
    if (el.closest && el.closest("#pick-list")) { const c = document.getElementById("pick-n"); if (c) c.textContent = document.querySelectorAll("#pick-list input:checked:not(:disabled)").length + " selected"; return; }
    if (el.id === "c-logo") {
      const f = el.files && el.files[0]; if (!f) return;
      loadLogo(f).then(d => { S.logoDraft = d; const pv = document.getElementById("c-logo-prev"); if (pv) pv.innerHTML = '<img data-logo src="' + d + '" alt="">'; })
        .catch(err => { el.value = ""; toast(err.message); });
      return;
    }
    if (el.id === "cp-stage") {
      const w = document.getElementById("won-warn"); if (w) w.hidden = !(el.value === "won" && el.dataset.orig !== "won");
      const sw = document.getElementById("cp-status-wrap"); if (sw) sw.hidden = el.value !== "won";
      return;
    }
    if (el.id === "bk-file") {
      const f = el.files && el.files[0], info = document.getElementById("bk-info"), go = document.getElementById("bk-go"); S.bkData = null; go.disabled = true;
      if (!f) return;
      try {
        const d = JSON.parse(await f.text());
        if (d.kind !== "pandora-hq-backup" || !d.collections) throw new Error("x");
        S.bkData = d; go.disabled = false;
        info.textContent = "Backup from " + fmtStamp(d.at) + ": " + BK_COLLS.map(k => ((d.collections[k] || []).length) + " " + k).join(", ") + ".";
      } catch (e) { info.textContent = "That file isn't an HQ backup."; }
      return;
    }
    if (el.id === "cp-tpl") { const db = document.getElementById("del-tpl-btn"); if (db) { db.hidden = !el.value.startsWith("c:"); db.textContent = "Delete saved template"; db.classList.remove("danger", "armed"); } return; }
    if (el.dataset.post) {
      const f = el.dataset.f; let v = el.value;
      if (f !== "date" && f !== "status") { v = parseNum(v); el.value = v == null ? "" : v; }
      upd("posts", el.dataset.post, { [f]: v });
    } else if (el.dataset.creator) {
      const f = el.dataset.f; let v;
      if (f === "signups" || f === "volume" || f === "followers" || f === "fee") { v = parseNum(el.value); el.value = v == null ? "" : (f === "followers" || f === "fee" ? v.toLocaleString("en-US") : v); }
      else if (el.tagName === "SELECT") v = el.value;
      else { v = el.value.trim(); el.value = v; }
      upd("creators", el.dataset.creator, { [f]: v });
      if (f === "signups" || f === "volume") { const r = S.creators.find(x => x.id === el.dataset.creator); if (r) { r[f] = v; recordHistory(r.campaignId); } }
    } else if (el.dataset.kpi) {
      const cp = S.campaigns.find(x => x.id === el.dataset.kpi); if (!cp) return;
      const v = parseNum(el.value); el.value = v == null ? "" : v;
      const kpis = (cp.kpis || []).map((k, i) => i === +el.dataset.i ? Object.assign({}, k, { actual: v }) : k);
      upd("campaigns", cp.id, { kpis });
      cp.kpis = kpis; recordHistory(cp.id);
    } else if (el.dataset.vis) {
      upd("campaigns", el.dataset.vis, { visible: el.checked });
    }
  });
  app.addEventListener("input", e => {
    const el = e.target;
    if (el.id === "net-q") { S.netQ = el.value; filterRows("#net-table", S.netQ.toLowerCase(), S.netPlat); }
    else if (el.id === "pick-q") filterRows("#pick-list", el.value.toLowerCase(), "");
  });
  app.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      if (S.modal) closeModal();
      else { const pv = document.getElementById("preview"); if (pv && !pv.hidden) { pv.hidden = true; pv.innerHTML = ""; } }
    } else if (e.key === "Enter" && e.target.classList && e.target.classList.contains("cell") && e.target.tagName === "INPUT") {
      e.target.blur();
    }
  });
  app.addEventListener("focusout", () => setTimeout(() => { if (S.pending) render(); }, 0));
}

/* ---------- boot ---------- */
async function boot() {
  if (HOSTED) { await window.__PD_READY; adminMode(false); return; }
  const hasHash = !!location.hash.slice(1);
  let decided = false;
  if (hasHash) clientMode();
  const fallback = setTimeout(() => { if (!decided && !hasHash) clientMode(); }, 2500);
  let admin = false;
  try {
    if (window.claude && typeof window.claude.use === "function") {
      const user = await window.claude.use("user");
      admin = user ? !!(await user.canEdit()) : false;
    }
  } catch (e) { admin = false; }
  decided = true; clearTimeout(fallback);
  if (admin) adminMode(hasHash);
  else if (!hasHash && MODE === "pending") clientMode();
}
boot();
})();
